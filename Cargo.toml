[package]
description = "Headless, AI-friendly 3D creation CLI with Blender-compatible modeling, evaluation, and .blend exchange"
edition.workspace = true
license.workspace = true
name = "potter"
repository.workspace = true
version.workspace = true

[[bin]]
name = "pot"
path = "src/main.rs"

[dependencies]
clap.workspace = true
potter-core.workspace = true
potter-workflow.workspace = true
serde_json.workspace = true

[dev-dependencies]
assert_cmd.workspace = true
exr.workspace = true
glam.workspace = true
hex.workspace = true
image.workspace = true
jsonschema.workspace = true
png.workspace = true
proptest.workspace = true
serde.workspace = true
sha2.workspace = true
tempfile.workspace = true

[profile.release]
codegen-units = 1
lto = true
strip = true

[lints]
workspace = true

[workspace]
members = ["crates/potter-core", "crates/potter-workflow"]

[workspace.package]
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/smartcrabai/potter"
version = "0.1.1"

[workspace.dependencies]
anyhow = "1"
assert_cmd = "=2.2.2"
base64 = "0.23"
clap = { version = "4.5", features = ["derive"] }
exr = "1.74"
flate2 = "1.1"
glam = { version = "0.34", features = ["serde"] }
hex = "0.4"
image = { version = "0.25", default-features = false, features = [
  "bmp",
  "hdr",
  "jpeg",
  "tga",
  "tiff",
  "webp",
] }
jcode-sdk = { git = "https://github.com/1jehuang/jcode", rev = "b6c63ff04ca6786d4d328a086d7f3ac06d6fb578" }
jsonschema = "=0.58.6"
lz4_flex = "0.14"
png = "0.18"
potter-core = { path = "crates/potter-core" }
potter-workflow = { path = "crates/potter-workflow" }
proptest = "=1.11.0"
robust = "1.2"
ruzstd = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.11"
tempfile = "=3.27.0"
uuid = { version = "1", features = ["v4", "serde"] }

[workspace.lints.clippy]
allow_attributes = "deny"
dbg_macro = "deny"
expect_used = "deny"
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"

cast_lossless = "allow"
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
many_single_char_names = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
similar_names = "allow"
struct_excessive_bools = "allow"
suboptimal_flops = "allow"
too_many_arguments = "allow"
too_many_lines = "allow"

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }

[workspace.metadata.dist]
allow-dirty = ["ci"]
cargo-dist-version = "0.33.0"
ci = "github"
install-path = "CARGO_HOME"
installers = ["shell", "homebrew"]
publish-jobs = ["homebrew"]
tap = "smartcrabai/homebrew-tap"
targets = [
  "aarch64-apple-darwin",
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "x86_64-pc-windows-msvc",
  "aarch64-pc-windows-msvc",
]

[profile.dist]
inherits = "release"
