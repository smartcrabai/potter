name: PR Auto-merge

on:
  pull_request:
    branches: [ main ]


# Blender 5.2.x: the .blend adapter (test job) and the VRM Add-on consumer (vrm-consumer job) both need it.
env:
  BLENDER_VERSION: 5.2.2

jobs:
  test:
    runs-on: ubuntu-latest
    # About 40 minutes (tests, then clippy) with warm caches; a hung Blender test should not hold the runner for 6 hours.
    timeout-minutes: 75
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive



      - name: Install taplo
        shell: bash
        run: |
          if ! command -v taplo &> /dev/null; then
            curl -fsSL https://github.com/tamasfe/taplo/releases/latest/download/taplo-linux-x86_64.gz \
              | gzip -d - | install -m 755 /dev/stdin /usr/local/bin/taplo
          fi

      - name: Lint Cargo.toml
        shell: bash
        run: taplo lint Cargo.toml crates/*/Cargo.toml

      - name: Check Cargo.toml formatting
        shell: bash
        run: taplo fmt --check --option reorder_keys=true Cargo.toml crates/*/Cargo.toml

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Check formatting
        shell: bash
        run: cargo fmt --all -- --check

      - name: Run cargo check
        shell: bash
        run: cargo check --workspace --all-features

      - name: Cache Blender
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/blender
          key: blender-${{ env.BLENDER_VERSION }}-linux-x64

      - name: Install Blender
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libice6 libsm6 libx11-6 libxext6 libxfixes3 libxi6 libxkbcommon0 libxrender1
          if [ ! -x "$HOME/blender/blender" ]; then
            mkdir -p "$HOME/blender"
            curl -fsSL "https://download.blender.org/release/Blender${BLENDER_VERSION%.*}/blender-${BLENDER_VERSION}-linux-x64.tar.xz" \
              | tar -xJ --strip-components=1 -C "$HOME/blender"
          fi
          "$HOME/blender/blender" --version
          echo "POTTER_BLENDER=$HOME/blender/blender" >> "$GITHUB_ENV"

      - name: Run tests
        shell: bash
        env:
          POTTER_REQUIRE_BLENDER: "1"
        run: cargo test --workspace --all-features

      - name: Run clippy
        shell: bash
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  vrm-consumer:
    runs-on: ubuntu-latest
    # Fixture build, official schema/glTF validation, Chromium render checks, and VRM Add-on for Blender imports.
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Build pot
        shell: bash
        run: cargo build --locked --bin pot

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: tests/vrm-consumer/package-lock.json

      - name: Cache VRM schemas
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: tests/vrm-consumer/.cache/schema
          key: vrm-schema-${{ hashFiles('tests/vrm-consumer/schema/schemas.lock.json') }}

      - name: Install consumer dependencies
        shell: bash
        working-directory: tests/vrm-consumer
        run: npm ci

      - name: Install Playwright Chromium
        shell: bash
        working-directory: tests/vrm-consumer
        run: npx playwright install --with-deps chromium

      - name: Cache Blender
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/blender
          key: blender-${{ env.BLENDER_VERSION }}-linux-x64

      - name: Install Blender
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libice6 libsm6 libx11-6 libxext6 libxfixes3 libxi6 libxkbcommon0 libxrender1
          if [ ! -x "$HOME/blender/blender" ]; then
            mkdir -p "$HOME/blender"
            curl -fsSL "https://download.blender.org/release/Blender${BLENDER_VERSION%.*}/blender-${BLENDER_VERSION}-linux-x64.tar.xz" \
              | tar -xJ --strip-components=1 -C "$HOME/blender"
          fi
          "$HOME/blender/blender" --version
          echo "POTTER_BLENDER=$HOME/blender/blender" >> "$GITHUB_ENV"

      - name: Cache VRM Add-on for Blender
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: tests/vrm-consumer/.cache/vrm-addon
          key: vrm-addon-${{ hashFiles('tests/vrm-consumer/blender/vrm-addon.lock.json') }}

      - name: Run VRM consumer tests
        shell: bash
        working-directory: tests/vrm-consumer
        env:
          POT: ${{ github.workspace }}/target/debug/pot
          POTTER_REQUIRE_BLENDER: "1"
        run: npm test


  automerge:
    runs-on: ubuntu-latest
    needs: [test, vrm-consumer]
    if: github.event.pull_request.user.login == 'renovate[bot]'
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: automerge
        uses: pascalgn/automerge-action@7961b8b5eec56cc088c140b56d864285eabd3f67 # v0.16.4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MERGE_LABELS: "automerge"
